name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/arulnanda787/digit-classifier

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-serve.txt

      - name: Install dependencies
        run: pip install -r requirements-serve.txt pytest==8.3.2 httpx==0.27.0

      - name: Run tests
        run: python -m pytest -v

  docker:
    name: Build, smoke-test, publish
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build amd64 image for testing
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: digit-classifier:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the container